[project]
name = "ai-product-data-platform"
version = "0.1.0"
description = "AI Product Data Enrichment Platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "psycopg2-binary",
    "python-multipart",
    "pandas",
    "openpyxl",
    "requests",
    "beautifulsoup4",
    "google-generativeai",
    "google-genai>=2.19.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "app.main:app"
